institute: "Université de Lorraine | ENSGSI"
author: 
  - "MCF. Fabio A. CRUZ SANCHEZ"
title-slide-attributes:
  #data-background-image: figures/title-page.png
  data-background-size: contain
  data-background-opacity: "0.5"
format: 
  revealjs:
    slide-number: c/t
    controls: true
    transition: none
    #margin: 10
    width: 1600
    height: 900
    theme: [default, ../assets/custom.scss]
    css: ../assets/fabio.css
    logo: "../assets/img/logos/ENSGSI.png"
    #embed-resources: false
    echo: false
    pdf-separate-fragments: true
    #toc: true
    #toc-title: Agenda for today
    #toc-depth: 1
    center: false
    number-sections: false
    fig-align: center
    code-copy: true        
    header-logo: "../assets/img/logos/UL.png"    
    #subtitle-as-header: true
    sc-sb-title: false
    chalkboard: false
    footer: 'Introduction to Scientific Research'
    header: ''
    auto-stretch: true
    slide-level: 3
    menu:
      side: right
      width: wide
      numbers: true  
filters:
  - reveal-header
  - highlight-text
revealjs-plugins:
  - attribution 

date: today
date-format: long
#  - reveal-auto-agenda
#auto-agenda:
#  bullets: numbered
#  heading: Agenda for today



